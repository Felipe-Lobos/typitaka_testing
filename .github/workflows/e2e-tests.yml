name: E2E Tests with Allure Report

on:
  # Evento enviado desde tu otro repositorio (Vite deploy)
  repository_dispatch:
    types: [run_e2e_tests]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # CHECKOUT DEL REPO DE TESTS
      # --------------------------------------------
      - name: Checkout Test Code
        uses: actions/checkout@v4

      # --------------------------------------------
      # RECIBIR LA URL DESDE EL DEPLOY DEL OTRO REPO
      # --------------------------------------------
      - name: Set App URL
        id: set_url
        run: echo "APP_URL=${{ github.event.client_payload.app_url }}" >> $GITHUB_ENV

      # --------------------------------------------
      # INSTALAR JAVA
      # --------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # --------------------------------------------
      # INSTALAR DEPENDENCIAS DEL PROYECTO
      # --------------------------------------------
      - name: Install dependencies
        run: mvn -B clean install -DskipTests

      # --------------------------------------------
      # EJECUTAR LOS TESTS DE SELENIUM
      # --------------------------------------------
      - name: Run Selenium Tests
        run: mvn test -Dapp.url=${{ env.APP_URL }}

      # --------------------------------------------
      # INSTALL ALLURE CLI (fix)
      # --------------------------------------------
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # Generate Allure Report (relative paths for GitHub Pages)
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate target/allure-results -o target/allure-report --clean -p

      # --------------------------------------------
      # PUBLICAR EL REPORTE EN GITHUB PAGES
      # --------------------------------------------
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          force_orphan: true
