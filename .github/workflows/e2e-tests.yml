name: E2E Tests with Allure Report

on:
  # Evento enviado desde tu otro repositorio (Vite deploy)
  repository_dispatch:
    types: [run_e2e_tests]

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # CHECKOUT DEL REPO DE TESTS
      # --------------------------------------------
      - name: Checkout Test Code
        uses: actions/checkout@v4

      # --------------------------------------------
      # RECIBIR LA URL DESDE EL DEPLOY DEL OTRO REPO
      # --------------------------------------------
      - name: Set App URL
        id: set_url
        run: echo "APP_URL=${{ github.event.client_payload.app_url }}" >> $GITHUB_ENV

      # --------------------------------------------
      # INSTALAR JAVA
      # --------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # --------------------------------------------
      # INSTALAR DEPENDENCIAS DEL PROYECTO
      # --------------------------------------------
      - name: Install dependencies
        run: mvn -B clean install -DskipTests

      # --------------------------------------------
      # EJECUTAR LOS TESTS DE SELENIUM
      # --------------------------------------------
      - name: Run Selenium Tests
        run: mvn test -Dapp.url=${{ env.APP_URL }}

      # --------------------------------------------
      # GENERAR REPORTES ALLURE
      # --------------------------------------------
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report

      # --------------------------------------------
      # PUBLICAR EL REPORTE EN GITHUB PAGES
      # --------------------------------------------
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
