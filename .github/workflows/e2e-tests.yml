name: E2E Tests with Allure Report

on:
  repository_dispatch:
    types: [run_e2e_tests]
  # Para probar manualmente
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # CHECKOUT
      # --------------------------------------------
      - name: Checkout Test Code
        uses: actions/checkout@v4

      # --------------------------------------------
      # RECIBIR URL
      # --------------------------------------------
      - name: Set App URL
        run: |
          echo "APP_URL=${{ github.event.client_payload.app_url }}" >> $GITHUB_ENV
          echo "📍 Testing URL: ${{ github.event.client_payload.app_url }}"

      # --------------------------------------------
      # JAVA
      # --------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # --------------------------------------------
      # CHROME (necesario para Selenium)
      # --------------------------------------------
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # --------------------------------------------
      # INSTALAR DEPENDENCIAS
      # --------------------------------------------
      - name: Install dependencies
        run: mvn -B clean install -DskipTests

      # --------------------------------------------
      # EJECUTAR TESTS
      # --------------------------------------------
      - name: Run Selenium Tests
        run: mvn test -Dapp.url=${{ env.APP_URL }} -Dheadless=true
        continue-on-error: true

      # --------------------------------------------
      # INSTALAR ALLURE CLI (CORREGIDO) 🔥
      # --------------------------------------------
      - name: Install Allure CLI
        if: always()
        run: |
          echo "📦 Instalando Allure CLI..."
          
          # Descargar Allure
          wget -q https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          
          # Extraer
          tar -zxf allure-2.30.0.tgz
          
          # Mover a /opt
          sudo mv allure-2.30.0 /opt/allure
          
          # Crear symlink
          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          
          # Verificar instalación
          allure --version
          
          echo "✅ Allure instalado correctamente"

      # --------------------------------------------
      # GENERAR REPORTE
      # --------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          echo "📊 Generando reporte Allure..."
          
          # Verificar que hay resultados
          if [ -d "target/allure-results" ]; then
            echo "✅ Resultados encontrados:"
            ls -la target/allure-results/
          else
            echo "❌ No hay resultados de Allure"
            exit 1
          fi
          
          # Generar reporte
          allure generate target/allure-results \
            --clean \
            --output target/allure-report
          
          echo "✅ Reporte generado en target/allure-report"
          ls -la target/allure-report/

      # --------------------------------------------
      # DEPLOY A GITHUB PAGES
      # --------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          force_orphan: true
          enable_jekyll: false

      # --------------------------------------------
      # MOSTRAR URL DEL REPORTE
      # --------------------------------------------
      - name: Show Report URL
        if: always()
        run: |
          echo "📊 Reporte disponible en:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"